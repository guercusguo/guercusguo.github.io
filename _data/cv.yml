basics:
  name: Guido Antonio Di Carlo
  label: Geographer & Geospatial Software Engineer
  location: Turin, Italy
  coordinates: "45.07° N · 7.69° E"   # only shown by the Atlas design
  # photo: /assets/img/photo.jpg   # optional portrait, shown round in the header
  # phone: "+00 000 000 000"      # public on the web — uncomment only if you want that
  links:
    - { label: LinkedIn, url: "https://www.linkedin.com/in/guido-antonio-di-carlo/" }
  summary: >-
    Geographer and geospatial software engineer. I came to maps through
    biology and environmental questions, and I still read places as much through
    people and territory as through data: alongside my work I am studying for a
    second Master's degree, in Sociology. At the European Commission's Joint
    Research Centre I build and run the platforms behind the Copernicus
    Emergency Management Service, which delivers maps and geodata to civil
    protection authorities before and after disasters. I have lived and worked
    in Iceland, France, Switzerland, the UK and Italy.

experience:
  - role: Geospatial Full-Stack Developer & Cloud/GIS Platform Engineer
    org: European Commission, Joint Research Centre (external consultant)
    location: Turin, Italy
    start: Jan 2023
    end: Present
    summary: >-
      I design, build and operate the web applications, APIs and cloud
      infrastructure of the [Copernicus Emergency Management Service](https://mapping.emergency.copernicus.eu/)
      (CEMS) Risk and Recovery Mapping service.
    highlights:
      - "**Applications:** the operational platform for activations and the public portal."
      - "**APIs:** the CEMS Geo Services API, built on open geospatial standards."
      - "**Cloud:** the AWS environment and its CI/CD pipelines, including security and access control."
      - "**Coordination:** technical focal point for the providers running the enterprise GIS platform."

  - role: Geographic Information Systems Expert
    org: European Commission, Joint Research Centre (external consultant)
    location: Ispra, Italy
    start: Aug 2022
    end: Present
    summary: >-
      I manage CEMS Risk and Recovery Mapping activations and its aerial
      component, which acquires imagery and LiDAR from aircraft and drones.
    highlights:
      - "**Activations:** from request to delivery, defining requirements with the civil protection authorities who request them."
      - "**Quality control:** of maps, geodata, reports, aerial imagery and LiDAR against CEMS specifications."
      - "**Tenders:** drafting framework contract documents and technical specifications, and evaluating provider proposals."

  - role: GIS Analyst & Web Mapping Developer
    org: "[ITHACA](https://ithaca.earth/)"
    location: Turin, Italy
    start: Jan 2019
    end: Jun 2022
    summary: >-
      A research centre for geomatics and remote sensing in emergency
      management, and a CEMS service provider.
    highlights:
      - "**Emergency mapping:** cartography and geodata for CEMS Rapid Mapping and Risk and Recovery Mapping, from optical and SAR imagery."
      - "**Web platforms:** lead developer of ITHACA's web mapping platforms and internal tools."
      - "**European Environment Agency study:** technical lead of an audit of EU27 national geodata, its accessibility and its INSPIRE and Open Data compliance."

  - role: On-call GIS Specialist, Earth Observation
    org: "[ITHACA](https://ithaca.earth/)"
    location: Turin, Italy
    start: Jun 2017
    end: Dec 2018
    summary: >-
      On-call production for CEMS Rapid Mapping, the EU's 24/7 service: mapping
      floods, fires and damage from satellite imagery within hours of a
      disaster.

# Things a visitor can click through to. `url` is optional.
work:
  - name: Copernicus EMS mapping portal
    url: https://mapping.emergency.copernicus.eu/
    description: The public site where every activation, map and dataset is published. I work on its data ingestion, templates and search.
  - name: CEMS Geo Services API
    description: A standards-based API that lets other systems query and download the service's geodata. I designed and built it.
  - name: EU27 geodata audit
    description: A study for the European Environment Agency of how accessible each member state's authoritative geodata really is. I led the technical work.

