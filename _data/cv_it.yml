basics:
  name: Guido Antonio Di Carlo
  label: Geografo e ingegnere del software geospaziale
  location: Torino, Italia
  coordinates: "45.07° N · 7.69° E"
  links:
    - { label: LinkedIn, url: "https://www.linkedin.com/in/guido-antonio-di-carlo/" }
  summary: >-
    Geografo e ingegnere del software geospaziale. Sono arrivato alle mappe
    dalla biologia e dalle questioni ambientali, e continuo a leggere i luoghi
    attraverso le persone e il territorio quanto attraverso i dati: accanto al
    lavoro sto conseguendo una seconda laurea magistrale, in Sociologia. Al
    Joint Research Centre della Commissione Europea costruisco e gestisco le
    piattaforme del Copernicus Emergency Management Service, che fornisce mappe
    e geodati alle autorità di protezione civile prima e dopo i disastri. Ho
    vissuto e lavorato in Islanda, Francia, Svizzera, Regno Unito e Italia.

experience:
  - role: Sviluppatore full-stack geospaziale e ingegnere di piattaforme cloud/GIS
    org: Commissione Europea, Joint Research Centre (consulente esterno)
    location: Torino, Italia
    start: gen 2023
    end: oggi
    summary: >-
      Progetto, sviluppo e gestisco le applicazioni web, le API e
      l'infrastruttura cloud del servizio Risk and Recovery Mapping del
      [Copernicus Emergency Management Service](https://mapping.emergency.copernicus.eu/)
      (CEMS).
    highlights:
      - "**Applicazioni:** la piattaforma operativa per le attivazioni e il portale pubblico."
      - "**API:** la CEMS Geo Services API, basata su standard geospaziali aperti."
      - "**Cloud:** l'ambiente AWS e le sue pipeline CI/CD, compresi sicurezza e controllo degli accessi."
      - "**Coordinamento:** referente tecnico per i fornitori che gestiscono la piattaforma GIS enterprise."

  - role: Esperto di sistemi informativi geografici
    org: Commissione Europea, Joint Research Centre (consulente esterno)
    location: Ispra, Italia
    start: ago 2022
    end: oggi
    summary: >-
      Gestisco le attivazioni del CEMS Risk and Recovery Mapping e della sua
      componente aerea, che acquisisce immagini e dati LiDAR da aerei e droni.
    highlights:
      - "**Attivazioni:** dalla richiesta alla consegna, definendo i requisiti con le autorità di protezione civile che le richiedono."
      - "**Controllo qualità:** di mappe, geodati, rapporti, immagini aeree e LiDAR rispetto alle specifiche CEMS."
      - "**Gare:** redazione dei documenti dei contratti quadro e delle specifiche tecniche, e valutazione delle offerte dei fornitori."

  - role: Analista GIS e sviluppatore web mapping
    org: "[ITHACA](https://ithaca.earth/)"
    location: Torino, Italia
    start: gen 2019
    end: giu 2022
    summary: >-
      Centro di ricerca in geomatica e telerilevamento per la gestione delle
      emergenze, e fornitore di servizi CEMS.
    highlights:
      - "**Cartografia d'emergenza:** cartografia e geodati per CEMS Rapid Mapping e Risk and Recovery Mapping, da immagini ottiche e SAR."
      - "**Piattaforme web:** sviluppatore principale delle piattaforme di web mapping e degli strumenti interni di ITHACA."
      - "**Studio per l'Agenzia Europea dell'Ambiente:** responsabile tecnico di un audit dei geodati nazionali dei 27 Stati membri, della loro accessibilità e della conformità a INSPIRE e Open Data."

  - role: Specialista GIS reperibile, osservazione della Terra
    org: "[ITHACA](https://ithaca.earth/)"
    location: Torino, Italia
    start: giu 2017
    end: dic 2018
    summary: >-
      Produzione in reperibilità per CEMS Rapid Mapping, il servizio dell'UE
      attivo 24 ore su 24: mappatura di alluvioni, incendi e danni da immagini
      satellitari entro poche ore da un disastro.

work:
  - name: Portale cartografico del Copernicus EMS
    url: https://mapping.emergency.copernicus.eu/
    description: Il sito pubblico in cui vengono pubblicati ogni attivazione, mappa e dataset. Mi occupo dell'acquisizione dei dati, dei template e della ricerca.
  - name: CEMS Geo Services API
    description: Un'API basata su standard che permette ad altri sistemi di interrogare e scaricare i geodati del servizio. L'ho progettata e sviluppata.
  - name: Audit dei geodati dell'UE27
    description: Uno studio per l'Agenzia Europea dell'Ambiente su quanto siano davvero accessibili i geodati ufficiali di ciascuno Stato membro. Ho guidato la parte tecnica.

